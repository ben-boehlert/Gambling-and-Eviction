# =============================================================================
# power_lpdid_shift12_mde_noNV.yml — shift12 treatment definition, NV-free.
#
# shift12 = online launch + 12 months, uniformly. Paired against the ramp75
# arms to answer ONE question: does ramp75's size-gate advantage over raw
# online dating come from the LAG, or from the handle-specific timing?
#
# WHY IT MATTERS. ramp75 dates each state by when handle reaches 75% of its own
# MAX OBSERVED month, so the date is a function of data vintage: the ramp75 lag
# past launch correlates 0.957 with months of post-launch handle observed
# (slope 0.257, t = 17.4). Since observation length is determined by launch
# date, ramp75 systematically redates early cohorts later and late cohorts
# earlier -- contaminating event time along the cohort dimension the design
# identifies from. It is also a blindness violation (handle is post-treatment
# and outcome-adjacent). shift12 uses no outcome data at all.
#
# ramp75's median lag is 18 months against shift12's 12, and ramp75 is EARLIER
# than shift12 for only 8 of 30 states -- so these are different timings, not a
# relabelling.
#
# Schedule: data/processed/shift12_schedule.csv (data_prep/build_shift12_schedule.R).
# NV excluded from the outset so this is directly comparable to
# lpdid_ramp75_{gate,mde}_noNV. D1 feasibility pre-checked: 30/30 NV-free.
#
# =============================================================================
# =============================================================================
# power_lpdid_mde.yml — MDE curves for the post-COVID vs spliced windows.
#
# The two size gates (power_lpdid_gate.yml, power_lpdid_gate_postcovid.yml)
# established SIZE with a 2-point grid (delta = 0, 0.05). They cannot locate an
# MDE. This config runs both windows on one wide effect grid so the MDEs are
# directly comparable, with identical seeds (base_seed 20260723) => rep-for-rep
# paired panels across both windows and with every earlier run.
#
# GRID RANGE. The post-COVID design is small (7 treated / 10 control) and its
# LP-DiD sampling SD is ~0.115 log points, so 80% power needs roughly
# 2.8 x SE ~ 0.28 log points. A grid stopping at 0.20 (as in power_primary)
# would return "never_crosses_target" for every estimator in that window, so it
# is extended to 0.60. The spliced window will cross far earlier; the shared
# grid is what makes the two windows comparable.
#
# Deltas are proportional changes in filings (impose_effects.R), so 0.30 = a
# 30% increase — report these in real-world filings terms in the PAP per AV
# guidance, not as raw log points.
#
# Scenario count: 2 (A = spliced/covid drop, B = post-COVID). Run locally.
# =============================================================================

run_name: lpdid_shift12_mde_noNV

exclude_states: [NV]

# ramp75 dating with HYBRID CONTROL CODING: schedule carries online + ramp75
# dates; run_scenario_grid derives pseudo_launch from the per-cohort lag and
# .re_lpdid gates controls on launch. Size gate only (delta = 0).
schedule:   data/processed/shift12_schedule.csv

# ---- Top-level defaults -----------------------------------------------------

level:      state
sample:     [S2]
covid:      drop
treat_def:  shift12_start_date

designs:      [D1]
mechanisms:   [count_nb]
shapes:       [step]
outcomes:     [y_log1p]
control_group: notyettreated

est_anticipation: 0

template:   panel

# Dense where the spliced window's MDE is expected, extended far enough that
# the small post-COVID design can actually cross 80% power.
effect_grid:  [0, 0.02, 0.05, 0.08, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.50, 0.60]

estimators:   [twfe, lpdid]
lpdid_wild:   true              # the arm power_lpdid_mde.yml never switched on

# ---- Execution --------------------------------------------------------------

n_reps:     300
base_seed:  20260723           # pairs with both size gates and smoke/cheap/primary
mde_boot:   200                # bootstrap CI on the interpolated MDE

alpha:      [0.1, 0.05, 0.01]

min_pre:    12
min_post:   6

anticipation_months: 6

# ---- Scenario families ------------------------------------------------------

scenarios:

  # A. Spliced panel (the standard framework window).
  - name: mde_spliced
    covid: drop

  # B. Clean post-COVID window. Also the "states that only ramped post-COVID"
  #    design — S2 truncation removes every early-ramp state automatically
  #    (see power_lpdid_gate_postcovid.yml header for the verification).
  - name: mde_postcovid
    covid: post
